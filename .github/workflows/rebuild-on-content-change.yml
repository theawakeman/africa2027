name: Reconstruir el sitio al editar contenido

on:
  push:
    branches: [main]
    paths:
      - "content/pois/**"
      - "content/ficha/**"
      - "assets/img/**"

permissions:
  contents: write

concurrency:
  group: rebuild-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Reconstruir el sitio estático
        run: python3 tools/gen/build.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Publicar los cambios
        run: |
          git config user.name "africa2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Reconstrucción automática tras editar contenido [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

        
