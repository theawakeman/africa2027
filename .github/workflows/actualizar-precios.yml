name: Actualizar precios (gasóleo, cambio y vigilancia de visados)

on:
  schedule:
    - cron: "17 5 * * 1"   # cada lunes a las 05:17 UTC
  workflow_dispatch: {}      # también a mano, desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: rebuild-main
  cancel-in-progress: false

jobs:
  precios:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Descargar precios y vigilar fuentes
        id: precios
        run: |
          python3 tools/actualizar_precios.py | tee avisos-precios.txt
          {
            echo "## Actualización de precios"
            echo
            sed 's/^/- /' avisos-precios.txt
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Reconstruir el sitio estático
        run: python3 tools/gen/build.py && python3 tools/validate_ui_contract.py
        env:
          PYTHONDONTWRITEBYTECODE: "1"

      - name: Publicar los cambios
        run: |
          rm -f avisos-precios.txt
          git config user.name "africa2027-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Actualización semanal de precios [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
